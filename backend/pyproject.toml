[project]
name = "second-brain"
version = "0.1.0"
description = "Local RAG over course materials and notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "watchdog>=5.0",
    "httpx>=0.27",
    "pydantic-settings[yaml]>=2.4",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "playwright>=1.63.0",
    "markdownify>=1.2.3",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
