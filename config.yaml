# Second Brain configuration. Env vars (see .env.example) override these.
database_url: postgresql://secondbrain:secondbrain@localhost:5433/secondbrain
ollama_url: http://127.0.0.1:11434   # not localhost: on Windows it tries IPv6 first and waits ~2 s

# Models (4 GB VRAM: keep the LLM around 4B at Q4)
llm_model: qwen3:4b-instruct   # non-thinking; alternatives: qwen2.5:3b, qwen2.5:7b-instruct (CPU offload)
embed_model: bge-m3
# 4 GB VRAM holds one model: keep embeddings on the CPU (ms per question) so the LLM is never evicted
embed_on_cpu: true
llm_keep_alive: 30m      # stay loaded through a revision session instead of reloading (~9 s)
embed_dim: 1024
num_ctx: 4096            # 5 passages x ~500 tokens + answer; smaller = more of the model on the GPU
temperature: 0.2

# Ingestion
watch_dir: inbox          # relative to project root
chunk_tokens: 500
chunk_overlap: 80
embed_batch: 16

# Retrieval: dense (pgvector) + keyword (Postgres full-text), fused with RRF
retrieval_mode: dense    # or hybrid; plain RRF ranked French exercise sheets above English course pages (see app.rag.compare)
top_k: 5                 # passages sent to the LLM
candidate_k: 20          # candidates per list before fusion
rrf_k: 60
min_score: 0.35          # refuse unless a passage is this close, or one passage has every keyword

# Blackboard sync: cd backend && uv run python -m app.sync.blackboard --probe
blackboard_url: https://esprit.blackboard.com
blackboard_browser: msedge
# Courses are matched to inbox folders by name. Add overrides here if a match is wrong:
# blackboard_course_map:
#   "Big Data Analytics - 5DS2": "Big Data Analytics"
blackboard_course_map: {}
